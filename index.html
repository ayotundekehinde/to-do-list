<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card">
        <header class="header">
          <h1>To-Do List</h1>
        </header>

        <form id="todo-form" class="todo-form">
          <label class="sr-only" for="todo-input">Add a task</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="What needs to be done?"
            autocomplete="off"
            maxlength="120"
          />
          <button type="submit">Add</button>
        </form>

        <div class="toolbar">
          <div id="task-count" class="task-count">0 tasks</div>
          <div class="filters" aria-label="Task filters">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="active" type="button">Active</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
          </div>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
